[project]
name = "handwritten-digit-recognition"
version = "0.1.0"
description = "Handwritten digit recognition using NumPy"
authors = [
    {name = "BoddyGus", email = "yan.dulin06@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)"
]

[tool.poetry]
packages = [
    { include = "digits", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pylint (>=4.0.8,<5.0.0)"
]